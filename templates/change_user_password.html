
{% extends "base.html" %}

{% block title %}
Change Password
{% endblock %}


{% block content %}

<div class="dashboard-header">

    <div>

        <div class="breadcrumb">
            ADMIN / USERS / PASSWORD
        </div>

        <h1>
            Change Password
        </h1>

        <p>
            Change the password for {{ user.username }}.
        </p>

    </div>

</div>


<div class="panel user-edit-panel">

    <div class="panel-header">

        <div>

            <h2>
                🔑 Change Password
            </h2>

            <p>
                User: <strong>{{ user.full_name }}</strong>
            </p>

        </div>

    </div>


    <form
        method="POST"
        action="{{ url_for(
            'change_user_password',
            id=user.id
        ) }}"
        class="user-form"
    >

        <div class="form-group">

            <label>
                New Password
            </label>

            <input
                type="password"
                name="password"
                required
                autocomplete="new-password"
                placeholder="Enter new password"
            >

        </div>


        <div class="form-group">

            <label>
                Confirm New Password
            </label>

            <input
                type="password"
                name="confirm_password"
                required
                autocomplete="new-password"
                placeholder="Confirm new password"
            >

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn-primary"
            >
                🔑 Change Password
            </button>


            <a
                href="{{ url_for('users') }}"
                class="btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
